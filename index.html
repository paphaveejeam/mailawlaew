<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบสร้างข้อสอบกฎหมายและธงคำตอบ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#1c1c1a;--mute:#75736e;--line:#e7e5e0;--acc:#2f4f4f;--acc-ink:#fff;--ok:#3f7d58;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#1f1f1d;--ink:#eeece8;--mute:#9a978f;--line:#302f2c;--acc:#9cc3c0;--acc-ink:#12201f;--ok:#7bc496;--warn:#e0b25a}}
:root[data-theme="dark"]{--bg:#161615;--card:#1f1f1d;--ink:#eeece8;--mute:#9a978f;--line:#302f2c;--acc:#9cc3c0;--acc-ink:#12201f;--ok:#7bc496;--warn:#e0b25a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-weight:400;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:20px;font-weight:600;margin:0}
.sub{color:var(--mute);font-size:13px;margin:2px 0 20px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-size:15px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.no{font-weight:600;font-size:14px}
select,textarea,input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
select{width:auto;min-width:200px}
textarea{resize:vertical;min-height:110px}
select:focus,textarea:focus,input:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.del{color:var(--mute);margin-left:auto}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.qbox{background:var(--bg);border-left:2px solid var(--acc);padding:8px 12px;border-radius:0 8px 8px 0;white-space:pre-wrap;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:40px 0;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 20px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.st{font-size:13px;display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.st.ok .dot{background:var(--ok)}
.bottom{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.note{font-size:12px;color:var(--mute);margin-top:22px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip small{opacity:.7;margin-left:4px}
details{margin-top:10px}summary{cursor:pointer;font-size:13px;color:var(--mute)}
.ans{white-space:pre-wrap;font-size:14px;margin-top:8px}
.meta{font-size:13px;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ข้อสอบกฎหมายและธงคำตอบ</h1>
  <div class="sub" id="sync">กำลังเชื่อมต่อ…</div>
  <nav id="nav">
    <button data-p="1" class="on">1 · ข้อสอบ</button>
    <button data-p="2">2 · คำตอบ</button>
    <button data-p="3">3 · เช็คลิสต์</button>
    <button data-p="4">4 · แยกตามวิชา</button>
  </nav>
  <main id="app"></main>
  <div class="note">แชร์ลิงก์ของหน้านี้ให้ผู้ร่วมงานที่มีสิทธิ์แก้ไข เพื่อช่วยกันเขียนและอัพเดทคำตอบร่วมกันได้</div>
</div>
<div id="toast"></div>
<script>
const SUBJECTS=["แพ่ง","อาญา","วิธีพิจารณาความแพ่ง","วิธีพิจารณาความอาญา","พยาน","พระธรรมนูญ","กฎหมายพิเศษ"];
let Q=[], page=1, subj=SUBJECTS[0], col=null, dl=null, pending=false, timers={};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const done=q=>(q.answer||'').trim().length>0;
const uid=()=>'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function sortQ(){Q.sort((a,b)=>(a.no||0)-(b.no||0))}

/* ---------- storage: shared db with local fallback ---------- */
function persist(q){
  clearTimeout(timers[q.id]);
  timers[q.id]=setTimeout(async()=>{
    try{ if(col) await col.doc(q.id).set({...q}); else localStorage.setItem('lawexam',JSON.stringify(Q)); }
    catch(e){ toast('บันทึกไม่สำเร็จ'); }
  },500);
}
function saveLocal(){try{localStorage.setItem('lawexam',JSON.stringify(Q))}catch(e){}}
async function init(){
  render();
  try{
    const db=await claude.use('db'); dl=await claude.use('downloads');
    if(db){
      col=db.collection('questions');
      col.onSnapshot(snap=>{
        const focused=app.contains(document.activeElement)&&/TEXTAREA|INPUT/.test(document.activeElement.tagName);
        const activeId=focused?document.activeElement.dataset.id:null;
        const m=new Map(Q.map(q=>[q.id,q]));
        snap.docs.forEach(d=>{ if(d.id===activeId) return; const v=d.data(); if(v) m.set(d.id,{...v,id:d.id}); });
        const ids=new Set(snap.docs.map(d=>d.id));
        Q=[...m.values()].filter(q=>ids.has(q.id)||q.id===activeId);
        sortQ(); $('#sync').textContent='ซิงก์ร่วมกัน · บันทึกอัตโนมัติ';
        if(focused) pending=true; else render();
      },()=>{$('#sync').textContent='ซิงก์ไม่ได้ · ใช้โหมดในเครื่อง'});
      return;
    }
  }catch(e){}
  try{Q=JSON.parse(localStorage.getItem('lawexam')||'[]')}catch(e){Q=[]}
  $('#sync').textContent='โหมดในเครื่อง (ยังไม่เชื่อมการแชร์)'; render();
}

/* ---------- actions ---------- */
function addQ(){
  const q={id:uid(),no:(Q.reduce((m,x)=>Math.max(m,x.no||0),0))+1,subject:SUBJECTS[0],question:'',answer:'',cases:'',laws:''};
  Q.push(q); persist(q); if(!col)saveLocal(); render();
}
function delQ(id){
  if(!confirm('ลบข้อนี้?'))return;
  Q=Q.filter(q=>q.id!==id);
  if(col) col.doc(id).delete().catch(()=>toast('ลบไม่สำเร็จ')); else saveLocal();
  render();
}
async function makePdf(items,withAnswer){
  await document.fonts.load('400 32px "Noto Sans Thai"');await document.fonts.load('600 32px "Noto Sans Thai"');
  const S=2,W=595*S,H=842*S,M=50*S,FS=16*S,LH=FS*1.7,MAXW=W-2*M,pages=[];
  let c,x,y;
  const np=()=>{c=document.createElement('canvas');c.width=W;c.height=H;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#111';x.textBaseline='alphabetic';y=M;pages.push(c)};
  const seg=p=>window.Intl&&Intl.Segmenter?Array.from(new Intl.Segmenter('th',{granularity:'word'}).segment(p),z=>z.segment):Array.from(p);
  const put=(t,bold)=>{
    x.font=(bold?'600 ':'400 ')+FS+'px "Noto Sans Thai",sans-serif';
    String(t||'').split('\n').forEach(par=>{
      let ln='';const out=[];
      const push=w=>{ if(x.measureText(ln+w).width>MAXW&&ln){out.push(ln);ln=''} ln+=w };
      seg(par).forEach(w=>{ if(x.measureText(w).width>MAXW){Array.from(w).forEach(push)} else push(w) });
      out.push(ln);
      out.forEach(l=>{ if(y+LH>H-M){np();x.font=(bold?'600 ':'400 ')+FS+'px "Noto Sans Thai",sans-serif'} x.fillText(l.trimEnd(),M,y+FS);y+=LH });
    });
  };
  np();
  items.forEach((q,i)=>{
    if(i){y+=LH*0.5;x.fillStyle='#ccc';x.fillRect(M,y,MAXW,2);x.fillStyle='#111';y+=LH*0.8}
    put('ข้อ '+q.no+' ('+q.subject+')',true);
    put('คำถาม',true);put(q.question||'-');
    if(withAnswer){
      put('ธงคำตอบ',true);put(q.answer||'- ยังไม่มีคำตอบ -');
      put('ฎีกาที่เกี่ยวข้อง',true);put(q.cases||'-');
      put('มาตราที่เกี่ยวข้อง',true);put(q.laws||'-');
    }
  });
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});
  pages.forEach((cv,i)=>{if(i)doc.addPage();doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,595,842)});
  return doc.output('blob');
}
async function download(name,items,withAnswer){
  if(!window.jspdf){toast('โหลดตัวสร้าง PDF ไม่สำเร็จ');return}
  toast('กำลังสร้าง PDF…');
  try{
    const blob=await makePdf(items,withAnswer);
    if(dl){await dl.save({filename:name+'.pdf',data:blob});toast('บันทึกไฟล์แล้ว');}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.pdf';a.click();toast('กำลังดาวน์โหลด');}
  }catch(e){ if(!e||e.code!=='declined') toast('สร้างไฟล์ไม่สำเร็จ'); }
}

/* ---------- views ---------- */
function view1(){
  const list=Q.map(q=>`<div class="card"><div class="row"><span class="no">ข้อ ${q.no}</span>
    <select data-id="${q.id}" data-f="subject">${SUBJECTS.map(s=>`<option ${s===q.subject?'selected':''}>${s}</option>`).join('')}</select>
    <button class="btn sm del" data-del="${q.id}">ลบ</button></div>
    <label>คำถาม</label><textarea data-id="${q.id}" data-f="question" placeholder="พิมพ์โจทย์ข้อสอบที่นี่">${esc(q.question)}</textarea></div>`).join('');
  return `<div class="row" style="margin-bottom:16px"><button class="btn pri" data-add>+ เพิ่มข้อสอบ</button>
    <button class="btn" data-dlall="q" ${Q.length?'':'disabled'}>บันทึกข้อสอบเป็น PDF</button></div>`+(list||'<div class="empty">ยังไม่มีข้อสอบ กด “เพิ่มข้อสอบ” เพื่อเริ่มต้น</div>');
}
function view2(){
  if(!Q.length) return '<div class="empty">ยังไม่มีคำถาม ไปเพิ่มที่หน้า “ข้อสอบ” ก่อน</div>';
  return Q.map(q=>`<div class="card"><div class="row"><span class="no">ข้อ ${q.no}</span><span class="tag">${esc(q.subject)}</span></div>
    <div class="qbox" style="margin-top:10px">${esc(q.question)||'<span style="color:var(--mute)">(ยังไม่มีคำถาม)</span>'}</div>
    <label>ธงคำตอบ</label><textarea data-id="${q.id}" data-f="answer" style="min-height:160px" placeholder="พิมพ์คำตอบ">${esc(q.answer)}</textarea>
    <label>ฎีกาที่เกี่ยวข้อง</label><input type="text" data-id="${q.id}" data-f="cases" value="${esc(q.cases)}" placeholder="เช่น ฎีกาที่ 1234/2560">
    <label>มาตราที่เกี่ยวข้อง / โน้ต</label><input type="text" data-id="${q.id}" data-f="laws" value="${esc(q.laws)}" placeholder="เช่น ป.พ.พ. มาตรา 420, 425"></div>`).join('');
}
function view3(){
  const n=Q.filter(done).length, pct=Q.length?Math.round(n/Q.length*100):0;
  const rows=Q.map(q=>`<div class="card"><div class="row"><span class="no">ข้อ ${q.no}</span><span class="tag">${esc(q.subject)}</span>
    <span class="st ${done(q)?'ok':''}"><span class="dot"></span>${done(q)?'ทำคำตอบแล้ว':'ยังไม่ได้ทำ'}</span>
    <button class="btn sm del" data-dl="${q.id}">ดาวน์โหลด</button></div></div>`).join('');
  return `<div class="row"><span>ทำแล้ว ${n} / ${Q.length} ข้อ</span><span style="margin-left:auto;color:var(--mute)">${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>`+(rows||'<div class="empty">ยังไม่มีข้อสอบ</div>')+
    `<div class="bottom"><button class="btn" data-dlall="a" ${Q.length?'':'disabled'}>ดาวน์โหลดทั้งหมด</button></div>`;
}
function view4(){
  const chips=SUBJECTS.map(s=>`<button class="chip ${s===subj?'on':''}" data-s="${s}">${s}<small>${Q.filter(q=>q.subject===s).length}</small></button>`).join('');
  const L=Q.filter(q=>q.subject===subj);
  const cards=L.map(q=>`<div class="card"><div class="row"><span class="no">ข้อ ${q.no}</span>
    <span class="st ${done(q)?'ok':''}"><span class="dot"></span>${done(q)?'ทำคำตอบแล้ว':'ยังไม่ได้ทำ'}</span></div>
    <div class="qbox" style="margin-top:10px">${esc(q.question)||'<span style="color:var(--mute)">(ยังไม่มีคำถาม)</span>'}</div>
    <details><summary>ดูธงคำตอบ</summary><div class="ans">${esc(q.answer)||'- ยังไม่มีคำตอบ -'}</div>
    <div class="meta">ฎีกา: ${esc(q.cases)||'-'}<br>มาตรา: ${esc(q.laws)||'-'}</div></details></div>`).join('');
  return `<div class="chips">${chips}</div><div class="row" style="margin-bottom:14px"><span>วิชา${subj} · ${L.length} ข้อ</span>
    <button class="btn sm" style="margin-left:auto" data-dlsub ${L.length?'':'disabled'}>ดาวน์โหลดวิชานี้เป็น PDF</button></div>`+(cards||'<div class="empty">ยังไม่มีข้อสอบในวิชานี้</div>');
}
function render(){
  pending=false;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',+b.dataset.p===page));
  app.innerHTML=page===1?view1():page===2?view2():page===3?view3():view4();
}

/* ---------- events ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){page=+b.dataset.p;render();scrollTo(0,0)}});
app.addEventListener('input',e=>{
  const t=e.target,id=t.dataset.id;if(!id)return;
  const q=Q.find(x=>x.id===id);if(!q)return;
  q[t.dataset.f]=t.value; persist(q); if(!col)saveLocal();
});
app.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.id){const q=Q.find(x=>x.id===t.dataset.id);q.subject=t.value;persist(q);if(!col)saveLocal()}});
app.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!app.contains(document.activeElement))render()},50));
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s){subj=b.dataset.s;render()}
  else if(b.dataset.dlsub!==undefined)download('วิชา'+subj,Q.filter(q=>q.subject===subj),true)
  else if(b.dataset.add!==undefined)addQ();
  else if(b.dataset.del)delQ(b.dataset.del);
  else if(b.dataset.dl){const q=Q.find(x=>x.id===b.dataset.dl);download('ข้อ'+q.no+'-'+q.subject,[q],true)}
  else if(b.dataset.dlall){const a=b.dataset.dlall==='a';download(a?'ข้อสอบและธงคำตอบ':'ข้อสอบ',Q,a)}
});
init();
</script>
</body>
</html>
